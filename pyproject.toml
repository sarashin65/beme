[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beme"
version = "0.1.0"
description = "Deterministic hiragana-to-surface conversion mock"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "sarashin"}]
dependencies = [
    "llama-cpp-python>=0.3.16",
    "sentence-transformers>=5.1.0",
    "sentencepiece>=0.2.1",
    "torch>=2.7.0",
]

[project.scripts]
beme = "beme.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = {index = "pytorch-cpu"}

[dependency-groups]
dev = [
    "datasets>=4.0.0",
    "fugashi>=1.0.0",
    "ipadic>=1.0.0",
    "pytest>=9.1.1",
]
