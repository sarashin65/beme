[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beme"
version = "0.1.0"
description = "Deterministic hiragana-to-surface conversion mock"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "sarashin"}]
dependencies = [
    "llama-cpp-python>=0.3.16",
]

[project.scripts]
beme = "beme.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
